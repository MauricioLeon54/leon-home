# /etc/systemd/system/gerbera.service.d/10-leon-storage.conf
# Serve movies only while the household drive is mounted, with the LEÓN icon on TVs.
# The fstab mount unit is generated, so `systemctl add-wants` refuses it. To start the server
# when the drive is connected, link gerbera.service into
# /etc/systemd/system/srv-leon\x2dstorage.mount.wants/.
[Unit]
BindsTo=srv-leon\x2dstorage.mount
After=srv-leon\x2dstorage.mount network-online.target
Wants=network-online.target
ConditionPathIsMountPoint=/srv/leon-storage

[Service]
BindReadOnlyPaths=/usr/local/share/leon-dlna/icons:/usr/share/gerbera/web/icons
