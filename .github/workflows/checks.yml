name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust-msrv:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.89.0 --profile minimal
      - name: Check all inventory targets with the locked dependencies on MSRV
        working-directory: rust/leon-netmap
        run: cargo +1.89.0 check --locked --all-targets
  application:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install development tools
        run: |
          npm install --global pnpm@12.15.0
          pnpm install --frozen-lockfile --ignore-scripts
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
          pnpm exec playwright install --with-deps chromium webkit
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Allow unprivileged ICMP datagrams on the disposable runner
        run: sudo sysctl -w 'net.ipv4.ping_group_range=0 2147483647'
      - name: Application and signature/authorization tests
        run: pnpm check
      - name: Actual Linux ARM64 executable and unprivileged socket tests
        run: pnpm build:netmap
      - name: Disposable fresh installation and owner-approved activation
        run: ./sharing/test-linux.sh
